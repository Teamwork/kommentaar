openapi: 3.0.3
info:
  title: x
  version: x
paths:
  /path/{id}:
    post:
      operationId: POST_path_{id}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: filter
          in: query
          schema:
            type: object
        - name: sort
          in: query
          required: true
          schema:
            type: object
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                notes:
                  type: string
      responses:
        "200":
          description: 200 OK (no data)
